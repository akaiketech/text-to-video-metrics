version: '3.8'

services:

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VIDEO_QUALITY_SERVICE_HOST=video_quality_service
      - TEXT_VIDEO_ALIGNMENT_SERVICE_HOST=text_video_alignment_service
    depends_on:
      - redis
      - video_quality_worker
      - text_video_alignment_worker
    volumes:
      - ./:/app
    restart: unless-stopped

  video_quality_worker:
    build:
      context: ./video_quality_service
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info --queues=video_quality
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./video_quality_service:/app
    restart: unless-stopped

  text_video_alignment_worker:
    build:
      context: ./text_video_alignment_service
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info --queues=alignment
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./text_video_alignment_service:/app
    restart: unless-stopped

volumes:
  redis_data:
